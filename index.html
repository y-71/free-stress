<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FREE STRESS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      cursor: none;
    }

    /* DVD bouncing logo */
    .dvd {
      --size: 200px;
      width: var(--size);
      height: var(--size);
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #fff;
      border: 2px solid #fff;
      animation:
        dvd-x 7.3s linear infinite alternate,
        dvd-y 11.7s linear infinite alternate,
        dvd-hue 23s linear infinite;
    }

    @keyframes dvd-x {
      0%   { left: 0; }
      100% { left: calc(100vw - var(--size)); }
    }

    @keyframes dvd-y {
      0%   { top: 0; }
      100% { top: calc(100vh - var(--size)); }
    }

    @keyframes dvd-hue {
      0%   { filter: hue-rotate(0deg); color: #ff0040; border-color: #ff0040; }
      25%  { color: #00ff88; border-color: #00ff88; }
      50%  { color: #4080ff; border-color: #4080ff; }
      75%  { color: #ff00ff; border-color: #ff00ff; }
      100% { filter: hue-rotate(360deg); color: #ff0040; border-color: #ff0040; }
    }

    /* Play button overlay */
    .play-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      cursor: pointer;
      transition: opacity 0.5s;
    }

    .play-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .play-btn {
      width: 80px;
      height: 80px;
      border: 2px solid #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .play-btn:hover {
      transform: scale(1.1);
    }

    .play-btn::after {
      content: '';
      display: block;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 15px 0 15px 28px;
      border-color: transparent transparent transparent #fff;
      margin-left: 5px;
    }

    /* Progress bar */
    .progress {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      z-index: 50;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #fff;
      transition: width 0.3s linear;
    }
  </style>
</head>
<body>

  <div class="dvd">FREE STRESS</div>

  <div class="play-overlay" id="playOverlay">
    <div class="play-btn"></div>
  </div>

  <div class="progress" id="progress">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const overlay = document.getElementById('playOverlay');
    const progressBar = document.getElementById('progress');
    const progressFill = document.getElementById('progressFill');

    let audio;

    function initAudio() {
      audio = new Audio();

      if (Hls.isSupported()) {
        const hls = new Hls({
          maxBufferLength: 30,
          maxMaxBufferLength: 60,
        });
        hls.loadSource('audio/playlist.m3u8');
        hls.attachMedia(audio);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          audio.play();
        });
      } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
        // Native HLS (Safari)
        audio.src = 'audio/playlist.m3u8';
        audio.addEventListener('loadedmetadata', () => {
          audio.play();
        });
      }

      // Update progress
      audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
          progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
        }
      });

      // Click to seek
      progressBar.addEventListener('click', (e) => {
        if (audio.duration) {
          const ratio = e.clientX / window.innerWidth;
          audio.currentTime = ratio * audio.duration;
        }
      });
    }

    overlay.addEventListener('click', () => {
      overlay.classList.add('hidden');
      initAudio();
    });
  </script>
</body>
</html>
