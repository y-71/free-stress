[build]
  command = "npm run build"
  publish = "build"

[[headers]]
  for = "/audio-v2/*"
  [headers.values]
    # Not immutable: filenames are reused when the track is re-encoded, so we
    # let clients revalidate (ETag) rather than freeze a stale copy for a year.
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"
    Accept-Ranges = "bytes"
